<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>给你的生日信 ♥</title>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;500&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#f7b6c8; --rose:#e06c8c; --gold:#e8c27a; --paper:#fff8f0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Ma Shan Zheng','Noto Serif SC','Songti SC',serif;color:#fff}
body{
  background:
    linear-gradient(160deg,rgba(255,170,200,.55),rgba(150,110,220,.55)),
    url('bg.jpg') center/cover no-repeat,
    linear-gradient(160deg,#ffd1dc,#c9b6ff);
}
#petals{position:fixed;inset:0;pointer-events:none;z-index:1}

.stage{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:40px;padding:20px}
.title{font-family:'Ma Shan Zheng',cursive;font-size:clamp(30px,6vw,52px);
  text-shadow:0 2px 14px rgba(224,108,140,.8);text-align:center;letter-spacing:4px}
.sub{font-weight:300;font-size:15px;opacity:.9;margin-top:10px;text-align:center;letter-spacing:2px}

/* 信封 */
.envelope{position:relative;width:min(320px,80vw);aspect-ratio:3/2;cursor:pointer;
  animation:float 4s ease-in-out infinite;filter:drop-shadow(0 20px 30px rgba(120,40,80,.4))}
@keyframes float{50%{transform:translateY(-12px)}}
.env-back{position:absolute;inset:0;background:#f3a6bd;border-radius:6px}
.paper{position:absolute;left:8%;right:8%;top:6%;height:80%;background:var(--paper);
  border-radius:4px;transition:transform .9s ease .5s;display:flex;align-items:center;
  justify-content:center;font-family:'Ma Shan Zheng';color:var(--rose);font-size:20px}
.env-front{position:absolute;inset:0;border-radius:6px;overflow:hidden;
  background:
   linear-gradient(to top right,transparent 49.5%,#f9c0d1 50%) left/50% 100% no-repeat,
   linear-gradient(to top left,transparent 49.5%,#f7b0c6 50%) right/50% 100% no-repeat,
   linear-gradient(#f8b8cc,#f8b8cc) bottom/100% 55% no-repeat}
.flap{position:absolute;left:0;top:0;width:100%;height:55%;transform-origin:top;
  background:#f19ab5;clip-path:polygon(0 0,100% 0,50% 100%);
  transition:transform .7s ease;z-index:3}
.seal{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);z-index:4;
  width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8fab,#c9184a);
  display:flex;align-items:center;justify-content:center;font-size:22px;
  box-shadow:0 3px 8px rgba(0,0,0,.35);transition:opacity .3s;animation:beat 1.4s infinite}
@keyframes beat{50%{transform:translate(-50%,-50%) scale(1.15)}}
.envelope.open{animation:none}
.envelope.open .flap{transform:rotateX(180deg);z-index:1}
.envelope.open .seal{opacity:0}
.envelope.open .paper{transform:translateY(-55%)}
.hint{font-size:14px;letter-spacing:3px;opacity:.9;animation:blink 2s infinite}
@keyframes blink{50%{opacity:.4}}

/* 弹窗 */
.mask{position:fixed;inset:0;z-index:10;background:rgba(60,20,50,.55);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center}
.mask.show{display:flex}
.box{width:min(340px,86vw);background:var(--paper);color:#7a3b52;border-radius:18px;
  padding:28px 24px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:pop .4s}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.box h3{font-family:'Ma Shan Zheng';font-size:26px;color:var(--rose);margin-bottom:6px}
.box p{font-size:13px;opacity:.8;margin-bottom:16px}
.box input{width:100%;padding:12px;border:1.5px solid var(--pink);border-radius:30px;
  text-align:center;font-size:16px;outline:none;background:#fff;color:#7a3b52}
.box input:focus{border-color:var(--rose)}
.box button{margin-top:14px;padding:11px 34px;border:none;border-radius:30px;cursor:pointer;
  background:linear-gradient(135deg,#ff9ebb,#e06c8c);color:#fff;font-size:15px;letter-spacing:2px}
.err{height:18px;margin-top:8px;font-size:12px;color:#d6336c}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* 信件阅读 */
.reader{position:fixed;inset:0;z-index:20;background:rgba(60,20,50,.7);backdrop-filter:blur(8px);
  display:none;flex-direction:column;align-items:center;padding:16px;gap:10px}
.reader.show{display:flex;animation:pop .6s}
.pages{flex:1;width:min(820px,100%);overflow-y:auto;background:#fff;border-radius:10px;
  box-shadow:0 0 40px rgba(255,180,210,.5);-webkit-overflow-scrolling:touch}
.pages canvas{width:100%;display:block;border-bottom:1px solid #f3d5df}
.pages .tip{color:#7a3b52;padding:30px;text-align:center}
.bar{display:flex;gap:12px}
.bar a,.bar button{padding:8px 22px;border-radius:30px;border:1px solid #fff8;background:#fff2;
  color:#fff;text-decoration:none;font-size:14px;cursor:pointer}

/* 音乐按钮 */
.music{position:fixed;right:18px;top:18px;z-index:30;width:44px;height:44px;border-radius:50%;
  border:none;background:rgba(255,255,255,.3);backdrop-filter:blur(4px);color:#fff;font-size:20px;cursor:pointer}
.music.playing{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<canvas id="petals"></canvas>
<button class="music" id="musicBtn" title="音乐">♪</button>
<audio id="bgm" src="music.mp3" loop preload="auto"></audio>

<div class="stage">
  <div>
    <div class="title">Happy Birthday!兔大王</div>
    <div class="sub">有一封信，给亲爱的你</div>
  </div>
  <div class="envelope" id="env">
    <div class="env-back"></div>
    <div class="paper">To My Love ♥</div>
    <div class="env-front"></div>
    <div class="flap"></div>
    <div class="seal">♥</div>
  </div>
  <div class="hint">点击信封，输入密码查看吧</div>
</div>

<!-- 密码弹窗 -->
<div class="mask" id="mask">
  <div class="box" id="box">
    <h3>悄悄话</h3>
    <p>提示：兔小姐和熊先生在一起的日子（8位）</p>
    <input id="pwd" type="password" placeholder="请输入密码" autocomplete="off">
    <div class="err" id="err"></div>
    <button id="ok">打开信封</button>
  </div>
</div>

<!-- 信件 -->
<div class="reader" id="reader">
  <div class="pages" id="pages"></div>
  <div class="bar">
    <a href="letter.pdf" target="_blank">新窗口打开</a>
    <button id="close">合上信纸</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
/* ====== 在这里修改 ====== */
const PASSWORD = "20221228";        // 密码
const PDF_URL  = "/Users/lys/Desktop/3234314134/letter.pdf";  // 信的路径
/* ======================== */

const $ = id => document.getElementById(id);
const env=$('env'), mask=$('mask'), pwd=$('pwd'), err=$('err'), bgm=$('bgm'), mbtn=$('musicBtn');

function playMusic(){ bgm.play().then(()=>mbtn.classList.add('playing')).catch(()=>{}); }
mbtn.onclick=()=>{
  if(bgm.paused){playMusic()} else {bgm.pause();mbtn.classList.remove('playing')}
};

env.onclick=()=>{
  if(env.classList.contains('open')) return;
  playMusic();
  mask.classList.add('show'); pwd.focus();
};
mask.onclick=e=>{ if(e.target===mask) mask.classList.remove('show') };

function check(){
  if(pwd.value.trim()===PASSWORD){
    mask.classList.remove('show');
    env.classList.add('open');
    setTimeout(()=>{
      $('reader').classList.add('show');
      loadPdf();
    },1700);
  }else{
    err.textContent='不对哦，再想想～';
    $('box').classList.remove('shake'); void $('box').offsetWidth; $('box').classList.add('shake');
    pwd.value='';
  }
}
$('ok').onclick=check;
pwd.onkeydown=e=>{ if(e.key==='Enter') check() };
$('close').onclick=()=>{
  $('reader').classList.remove('show');
  env.classList.remove('open');
};

/* PDF 渲染 */
let loaded=false;
async function loadPdf(){
  if(loaded) return; loaded=true;
  const box=$('pages');
  box.innerHTML='<div class="tip">信正在展开……</div>';
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc=
      'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
    const pdf=await pdfjsLib.getDocument(PDF_URL).promise;
    box.innerHTML='';
    const dpr=Math.min(window.devicePixelRatio||1,2);
    for(let i=1;i<=pdf.numPages;i++){
      const page=await pdf.getPage(i);
      const base=page.getViewport({scale:1});
      const vp=page.getViewport({scale:box.clientWidth/base.width*dpr});
      const c=document.createElement('canvas');
      c.width=vp.width; c.height=vp.height;
      box.appendChild(c);
      await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    }
  }catch(e){
    loaded=false;
    box.innerHTML='<div class="tip">信没能加载出来，请点下方“新窗口打开”试试</div>';
  }
}

/* 花瓣飘落 */
const cv=$('petals'), ctx=cv.getContext('2d');
let W,H; function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight} rs(); onresize=rs;
const N=innerWidth<600?25:45;
const ps=Array.from({length:N},()=>mk(true));
function mk(init){return{
  x:Math.random()*W, y:init?Math.random()*H:-20,
  s:6+Math.random()*10, v:.6+Math.random()*1.2, w:Math.random()*Math.PI*2,
  r:Math.random()*6, vr:(Math.random()-.5)*.04,
  c:['#ffc2d4','#ff9ebb','#ffd6e0','#fff0f5'][Math.floor(Math.random()*4)]}}
function draw(){
  ctx.clearRect(0,0,W,H);
  ps.forEach((p,i)=>{
    p.y+=p.v; p.w+=.02; p.x+=Math.sin(p.w)*.8; p.r+=p.vr;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
    ctx.fillStyle=p.c; ctx.globalAlpha=.85;
    ctx.beginPath(); ctx.moveTo(0,0);
    ctx.bezierCurveTo(p.s,-p.s,p.s*1.6,p.s*.6,0,p.s*1.4);
    ctx.bezierCurveTo(-p.s*1.6,p.s*.6,-p.s,-p.s,0,0);
    ctx.fill(); ctx.restore();
    if(p.y>H+30) ps[i]=mk(false);
  });
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
